name: Real LLM Kubernetes remediation demo

on:
  workflow_dispatch:
  push:
    branches:
      - kube-remediation-demo

permissions:
  contents: read

concurrency:
  group: kube-remediation-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact demo commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install verified kind and kubectl
        run: python3 scripts/install_worker_tools.py

      - name: Validate the source and protocol tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Run pinned CPU LLM with protected Kubernetes tests
        run: python3 scripts/llm_kubernetes_demo.py --output runs/github-llm-kubernetes-demo

      - name: Collect reports without cluster credentials
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          source = Path('runs/github-llm-kubernetes-demo')
          target = Path('reports')
          target.mkdir(exist_ok=True)
          for name in ('summary.json', 'model-pin.json', 'inference-smoke.json', 'model-commands.json', 'model-server.log'):
              if (source / name).is_file():
                  shutil.copy2(source / name, target / name)
          kube = source / 'kubernetes'
          for name in ('summary.json', 'image-pin.json', 'commands.json'):
              if (kube / name).is_file():
                  (target / 'kubernetes').mkdir(exist_ok=True)
                  shutil.copy2(kube / name, target / 'kubernetes' / name)
          if (kube / 'results').is_dir():
              shutil.copytree(kube / 'results', target / 'kubernetes' / 'results')
          PY

      - name: Upload reviewable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-llm-kubernetes-evidence
          path: reports/
          retention-days: 7
          if-no-files-found: warn
