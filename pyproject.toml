[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kronos-forecasting-lab"
version = "1.0.0"
description = "Causal probabilistic Kronos forecasting, evaluation, fine-tuning and agent tools"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas==2.2.2", "torch>=2.2,<3", "einops==0.8.1",
  "huggingface-hub>=0.33.1,<3", "safetensors>=0.6.2,<1", "tqdm>=4.67,<5",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.10,<2", "plotly>=6,<7",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.60,<1"]
compare = ["chronos-forecasting>=2,<3"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "playwright>=1.50,<2"]

[project.scripts]
kronos-lab = "kronos_lab.cli:main"

[tool.setuptools.packages.find]
include = ["kronos_lab*"]

[tool.setuptools.package-data]
kronos_lab = ["web/*.html", "web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests requiring real pretrained weights or external services"]
